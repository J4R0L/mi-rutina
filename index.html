<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mi Rutina - Gym</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --card-border: #1e1e2e;
    --card-hover: #1a1a28;
    --text: #e8e8ef;
    --text-dim: #7a7a8c;
    --text-muted: #4a4a5c;
    --accent-red: #ff4757;
    --accent-blue: #3742fa;
    --accent-green: #2ed573;
    --accent-yellow: #ffa502;
    --accent-purple: #a855f7;
    --accent-cyan: #18dcff;
    --gradient-1: linear-gradient(135deg, #ff4757, #ff6b81);
    --gradient-2: linear-gradient(135deg, #3742fa, #5352ed);
    --gradient-3: linear-gradient(135deg, #ffa502, #ffbe76);
    --gradient-4: linear-gradient(135deg, #2ed573, #7bed9f);
    --gradient-5: linear-gradient(135deg, #a855f7, #c084fc);
    --gradient-6: linear-gradient(135deg, #18dcff, #6a89ff);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
    -webkit-user-select: none;
    user-select: none;
  }

  .header {
    padding: 30px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(167, 85, 247, 0.08), transparent 60%);
    pointer-events: none;
  }

  .header h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e8e8ef, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .header p {
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 300;
  }

  .header .coach {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .stats-row {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .stats-row::-webkit-scrollbar { display: none; }

  .stat-chip {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 0 20px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 64px;
  }

  .tab .tab-day {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tab .tab-name {
    font-size: 0.78rem;
    font-weight: 600;
  }

  .tab.active {
    color: white;
    border-color: transparent;
  }

  .tab.active.push { background: var(--gradient-1); }
  .tab.active.pull { background: var(--gradient-2); }
  .tab.active.arms { background: var(--gradient-3); }
  .tab.active.chest-back { background: var(--gradient-5); }
  .tab.active.cardio { background: var(--gradient-6); }
  .tab.active.log { background: var(--gradient-4); }

  .exercise-note {
    font-size: 0.74rem;
    color: var(--text-dim);
    line-height: 1.45;
    margin: -2px 0 10px 40px;
  }

  .tab.rest {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .content {
    padding: 0 20px;
  }

  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .day-title {
    font-size: 1.3rem;
    font-weight: 700;
  }

  .day-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    background: var(--card);
    padding: 4px 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
  }

  .warmup-banner {
    background: linear-gradient(135deg, rgba(255, 165, 2, 0.15), rgba(255, 190, 118, 0.08));
    border: 1px solid rgba(255, 165, 2, 0.3);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.78rem;
    color: #ffc878;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .warmup-banner .icon { font-size: 1.1rem; }

  .knee-warning {
    background: linear-gradient(135deg, rgba(255, 71, 87, 0.12), rgba(255, 107, 129, 0.06));
    border: 1px solid rgba(255, 71, 87, 0.25);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.76rem;
    color: #ff8a93;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.5;
  }

  .exercise-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.2s;
  }

  .exercise-card.done {
    opacity: 0.5;
    background: rgba(46, 213, 115, 0.05);
    border-color: rgba(46, 213, 115, 0.2);
  }

  .exercise-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .check-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 2px solid var(--card-border);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .check-btn.checked {
    background: var(--accent-green);
    border-color: var(--accent-green);
  }

  .check-btn.checked::after {
    content: '✓';
    color: white;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .exercise-info {
    flex: 1;
    min-width: 0;
  }

  .exercise-name {
    font-size: 0.92rem;
    font-weight: 600;
    margin-bottom: 3px;
    line-height: 1.2;
  }

  .exercise-meta {
    font-size: 0.72rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .meta-tag {
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    background: rgba(167, 85, 247, 0.15);
    color: var(--accent-purple);
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 500;
  }

  .meta-tag.muscle { background: rgba(55, 66, 250, 0.15); color: #7286ff; }
  .meta-tag.rest { background: rgba(24, 220, 255, 0.15); color: var(--accent-cyan); }

  .exercise-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }

  .action-btn {
    padding: 8px 6px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card-hover);
    color: var(--text-dim);
    font-family: 'Outfit', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .action-btn:active { transform: scale(0.97); }

  .action-btn.video { color: #ff6b81; border-color: rgba(255, 71, 87, 0.3); }
  .action-btn.timer { color: var(--accent-cyan); border-color: rgba(24, 220, 255, 0.3); }
  .action-btn.weight { color: var(--accent-yellow); border-color: rgba(255, 165, 2, 0.3); }

  .note-card {
    background: linear-gradient(135deg, rgba(167, 85, 247, 0.1), rgba(192, 132, 252, 0.04));
    border: 1px solid rgba(167, 85, 247, 0.25);
    border-radius: 14px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 0.78rem;
    color: #c9a7f2;
    line-height: 1.5;
  }

  .note-card strong { color: #d4b8f5; }

  /* Log Tab */
  .log-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .log-empty .icon { font-size: 3rem; margin-bottom: 12px; display: block; }

  .log-entry {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .log-date {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .log-exercise {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.82rem;
  }

  .log-exercise:last-child { border-bottom: none; }

  .log-weight {
    color: var(--accent-yellow);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
  }

  .clear-log-btn {
    width: 100%;
    padding: 12px;
    margin-top: 14px;
    background: rgba(255, 71, 87, 0.1);
    border: 1px solid rgba(255, 71, 87, 0.3);
    color: var(--accent-red);
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 14px;
    text-align: center;
  }

  /* Timer Modal */
  .timer-display {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #18dcff, #6a89ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 20px 0;
    line-height: 1;
  }

  .timer-presets {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .preset-btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card-hover);
    color: var(--text-dim);
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
  }

  .preset-btn.active {
    background: var(--gradient-6);
    color: white;
    border-color: transparent;
  }

  .timer-controls {
    display: flex;
    gap: 8px;
  }

  .timer-controls button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-family: 'Outfit', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--gradient-6);
    color: white;
  }

  .btn-secondary {
    background: var(--card-hover);
    color: var(--text);
    border: 1px solid var(--card-border) !important;
  }

  /* Weight Modal */
  .weight-input {
    width: 100%;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    margin-bottom: 10px;
    text-align: center;
  }

  .weight-input:focus {
    outline: none;
    border-color: var(--accent-yellow);
  }

  .weight-label {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
  }

  /* Video Modal */
  .video-container {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 14px;
    background: #000;
  }

  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  .video-links {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .video-link {
    flex: 1;
    padding: 10px;
    background: var(--card-hover);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    text-align: center;
    font-size: 0.76rem;
    font-weight: 500;
  }

  .video-link.shorts {
    background: rgba(255, 71, 87, 0.12);
    border-color: rgba(255, 71, 87, 0.3);
    color: #ff8a93;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .timer-active {
    animation: pulse 1s ease-in-out infinite;
  }
</style>
</head>

<div class="header">
  <h1>💪 Mi Rutina</h1>
  <p>Pérdida de grasa · Pierna · Superior · Intervalos · Circuito · Cardio</p>
  <p class="coach">Coach: Nicolás Y. Leguizamón</p>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="tabs" id="tabs"></div>

<div class="content" id="content"></div>

<!-- Timer Modal -->
<div class="modal-overlay" id="timerModal">
  <div class="modal">
    <div class="modal-title">⏱️ Descanso</div>
    <div class="timer-display" id="timerDisplay">01:30</div>
    <div class="timer-presets">
      <button class="preset-btn" data-seconds="60" onclick="setPreset(60)">1:00</button>
      <button class="preset-btn active" data-seconds="90" onclick="setPreset(90)">1:30</button>
      <button class="preset-btn" data-seconds="120" onclick="setPreset(120)">2:00</button>
      <button class="preset-btn" data-seconds="180" onclick="setPreset(180)">3:00</button>
    </div>
    <div class="timer-controls">
      <button class="btn-primary" id="startBtn" onclick="toggleTimer()">Iniciar</button>
      <button class="btn-secondary" onclick="closeTimer()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Weight Modal -->
<div class="modal-overlay" id="weightModal">
  <div class="modal">
    <div class="modal-title" id="weightModalTitle">💪 Registrar peso</div>
    <label class="weight-label">Peso (kg)</label>
    <input type="number" class="weight-input" id="weightInput" placeholder="0" step="0.5">
    <label class="weight-label">Repeticiones</label>
    <input type="number" class="weight-input" id="repsInput" placeholder="0">
    <div class="timer-controls">
      <button class="btn-primary" onclick="saveWeight()">Guardar</button>
      <button class="btn-secondary" onclick="closeWeight()">Cancelar</button>
    </div>
  </div>
</div>

<!-- Video Modal -->
<div class="modal-overlay" id="videoModal">
  <div class="modal">
    <div class="modal-title" id="videoTitle">Video</div>
    <div class="video-container">
      <iframe id="videoFrame" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="video-links">
      <a class="video-link shorts" id="videoShortLink" target="_blank">🔍 Buscar Shorts</a>
      <a class="video-link" id="videoFullLink" target="_blank">📺 Video completo</a>
    </div>
    <div class="timer-controls">
      <button class="btn-secondary" style="width:100%" onclick="closeVideo()">Cerrar</button>
    </div>
  </div>
</div>

const trainingDays = Object.keys(exercises);
const restDays = ['jueves', 'domingo'];

// ==================== STATE ====================
let currentDay = getCurrentDay();
let timerInterval = null;
let timerSeconds = 90;
let timerRemaining = 90;
let timerRunning = false;
let currentWeightDay = null;
let currentWeightExercise = null;

function getCurrentDay() {
  const days = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
  const today = days[new Date().getDay()];
  if (exercises[today]) return today;
  // If rest day, go to next training day
  return trainingDays[0];
}

// ==================== STORAGE ====================
function getChecked() {
  const today = new Date().toDateString();
  const data = JSON.parse(localStorage.getItem('checked') || '{}');
  if (data.date !== today) {
    return { date: today, items: {} };
  }
  return data;
}

function setChecked(data) {
  localStorage.setItem('checked', JSON.stringify(data));
}

function toggleCheck(day, index) {
  const data = getChecked();
  const key = `${day}-${index}`;
  data.items[key] = !data.items[key];
  setChecked(data);
  renderDay(day);
  renderStats();
}

function getWeightLog() {
  return JSON.parse(localStorage.getItem('weightLog') || '{}');
}

function saveWeightLog(log) {
  localStorage.setItem('weightLog', JSON.stringify(log));
}

// ==================== RENDER ====================
function renderApp() {
  renderTabs();
  renderStats();
  renderDay(currentDay);
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  let html = '';
  trainingDays.forEach(day => {
    const d = exercises[day];
    const active = day === currentDay ? `active ${d.color}` : '';
    html += `
      <div class="tab ${active}" onclick="showDay('${day}')">
        <span class="tab-day">${d.day}</span>
        <span class="tab-name">${d.name}</span>
      </div>
    `;
  });
  html += `
    <div class="tab ${currentDay === 'log' ? 'active log' : ''}" onclick="showDay('log')">
      <span class="tab-day">📊</span>
      <span class="tab-name">Log</span>
    </div>
  `;
  tabsEl.innerHTML = html;
}

function renderStats() {
  const statsEl = document.getElementById('statsRow');
  const checked = getChecked();
  const doneToday = Object.values(checked.items).filter(v => v).length;
  const totalToday = exercises[currentDay]?.items.length || 0;
  const totalExercises = Object.values(exercises).reduce((sum, d) => sum + d.items.length, 0);
  const logEntries = Object.keys(getWeightLog()).length;

  statsEl.innerHTML = `
    <div class="stat-chip"><span class="dot"></span>Hoy: ${doneToday}/${totalToday}</div>
    <div class="stat-chip">📅 ${trainingDays.length} días/sem</div>
    <div class="stat-chip">💪 ${totalExercises} ejercicios</div>
    <div class="stat-chip">📊 ${logEntries} días registrados</div>
  `;
}

function showDay(day) {
  currentDay = day;
  renderTabs();
  renderStats();
  renderDay(day);
}

function renderDay(day) {
  const content = document.getElementById('content');

  if (day === 'log') {
    renderLog();
    return;
  }

  const d = exercises[day];
  if (!d) return;

  const checked = getChecked();

  let html = `
    <div class="day-header">
      <div>
        <div class="day-title">${d.name}</div>
        <div style="font-size:0.78rem;color:var(--text-dim);margin-top:2px">${d.subtitle}</div>
      </div>
      <div class="day-count">${d.items.length} ejercicios</div>
    </div>

    <div class="warmup-banner">
      <span class="icon">🔥</span>
      <span><strong>Siempre calentar</strong>: estiramientos dinámicos, movilidad y series de aproximación antes de empezar.</span>
    </div>

    <div class="knee-warning">
      <span class="icon">⚠️</span>
      <span><strong>Rodilla operada (LCA + menisco).</strong> Dolor hasta 3 de 10 está bien; si pasa de 3 o al otro día está hinchada, baja la carga. Nada de saltos, giros ni trote hasta que el fisio lo apruebe. <strong>Valgo:</strong> rodillas siempre alineadas con la punta de los pies, nunca hacia adentro.</span>
    </div>

    <div class="warmup-banner">
      <span class="icon">🩺</span>
      <span><strong>Presión:</strong> mídetela antes de entrenar; si sale alta, hoy solo cardio suave. Nunca aguantes la respiración: bota el aire en el esfuerzo. Termina cada serie con 2–3 repeticiones en reserva, no al fallo.</span>
    </div>
  `;

  d.items.forEach((ex, i) => {
    const key = `${day}-${i}`;
    const isChecked = checked.items[key];
    html += `
      <div class="exercise-card ${isChecked ? 'done' : ''}">
        <div class="exercise-top">
          <button class="check-btn ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${day}', ${i})"></button>
          <div class="exercise-info">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-meta">
              <span class="meta-tag">${ex.sets}</span>
              <span class="meta-tag muscle">${ex.muscle}</span>
              <span class="meta-tag rest">⏱ ${ex.rest}</span>
            </div>
          </div>
        </div>
        ${ex.note ? `<div class="exercise-note">${ex.note}</div>` : ''}
        <div class="exercise-actions">
          <button class="action-btn video" onclick="openVideo('${day}', ${i})">${ex.video ? '▶️ Video' : '🔍 Buscar video'}</button>
          <button class="action-btn timer" onclick="openTimer('${ex.rest}')">⏱️ Timer</button>
          <button class="action-btn weight" onclick="openWeight('${day}', ${i})">🏋️ Peso</button>
        </div>
      </div>
    `;
  });

  html += `
    <div class="note-card">
      <strong>📝 Recuerda:</strong> Dormir bien y comer excelente. Protein target: 150–165g/día. El descanso también es parte del entreno.
    </div>
  `;

  content.innerHTML = html;
}

function renderLog() {
  const content = document.getElementById('content');
  const log = getWeightLog();
  const dates = Object.keys(log).sort().reverse();

  if (dates.length === 0) {
    content.innerHTML = `
      <div class="log-empty">
        <span class="icon">📊</span>
        <p>Aún no hay registros</p>
        <p style="font-size:0.75rem;margin-top:6px">Registra pesos desde cada ejercicio</p>
      </div>
    `;
    return;
  }

  let html = '<div class="day-header"><div class="day-title">📊 Historial</div></div>';

  dates.forEach(date => {
    const entries = log[date];
    html += `
      <div class="log-entry">
        <div class="log-date">${new Date(date).toLocaleDateString('es-CO', { weekday: 'short', day: 'numeric', month: 'short' })}</div>
    `;
    entries.forEach(e => {
      html += `
        <div class="log-exercise">
          <span>${e.name}</span>
          <span class="log-weight">${e.weight}kg × ${e.reps}</span>
        </div>
      `;
    });
    html += '</div>';
  });

  html += '<button class="clear-log-btn" onclick="clearLog()">🗑️ Borrar historial</button>';
  content.innerHTML = html;
}

// ==================== TIMER ====================
function openTimer(rest) {
  const seconds = parseInt(rest) || 90;
  setPreset(seconds);
  document.getElementById('timerModal').classList.add('active');
}

function setPreset(seconds) {
  timerSeconds = seconds;
  timerRemaining = seconds;
  updateTimerDisplay();
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.seconds) === seconds);
  });
  if (timerRunning) stopTimer();
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60).toString().padStart(2, '0');
  const s = (timerRemaining % 60).toString().padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

function toggleTimer() {
  if (timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  timerRunning = true;
  document.getElementById('startBtn').textContent = 'Pausar';
  document.getElementById('timerDisplay').classList.add('timer-active');
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerDisplay').classList.remove('timer-active');
      document.getElementById('startBtn').textContent = 'Iniciar';
      // Vibration
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
      // Beep
      playBeep();
      timerRemaining = timerSeconds;
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('startBtn').textContent = 'Iniciar';
  document.getElementById('timerDisplay').classList.remove('timer-active');
}

function closeTimer() {
  stopTimer();
  timerRemaining = timerSeconds;
  updateTimerDisplay();
  document.getElementById('timerModal').classList.remove('active');
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.3;
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, 500);
  } catch(e) {}
}

// ==================== WEIGHT ====================
function openWeight(day, index) {
  currentWeightDay = day;
  currentWeightExercise = index;
  const ex = exercises[day].items[index];
  document.getElementById('weightModalTitle').textContent = ex.name;
  document.getElementById('weightInput').value = '';
  document.getElementById('repsInput').value = '';
  document.getElementById('weightModal').classList.add('active');
  setTimeout(() => document.getElementById('weightInput').focus(), 100);
}

function saveWeight() {
  const weight = parseFloat(document.getElementById('weightInput').value);
  const reps = parseInt(document.getElementById('repsInput').value);
  if (!weight || !reps) return;

  const today = new Date().toISOString().split('T')[0];
  const log = getWeightLog();
  if (!log[today]) log[today] = [];

  const ex = exercises[currentWeightDay].items[currentWeightExercise];
  // Remove previous entry for the same exercise today
  log[today] = log[today].filter(e => !(e.day === currentWeightDay && e.index === currentWeightExercise));

  log[today].push({
    day: currentWeightDay,
    index: currentWeightExercise,
    name: ex.name,
    weight: weight,
    reps: reps
  });

  saveWeightLog(log);
  closeWeight();
  renderApp();
  showDay(currentWeightDay);
}

function closeWeight() {
  document.getElementById('weightModal').classList.remove('active');
}

function clearLog() {
  if (confirm('¿Borrar todo el historial de pesos?')) {
    localStorage.removeItem('weightLog');
    renderApp();
    showDay('log');
  }
}

// ==================== VIDEO ====================
function openVideo(day, index) {
  const ex = exercises[day].items[index];
  const searchQuery = ex.search || ex.name;
  const shortsUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery + ' shorts técnica')}&sp=EgIYAQ%253D%253D`;

  if (!ex.video) {
    // Sin video guardado: abre la búsqueda en YouTube
    window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}`, '_blank');
    return;
  }

  document.getElementById('videoTitle').textContent = ex.name;
  document.getElementById('videoFrame').src = ex.video + '?rel=0';
  document.getElementById('videoShortLink').href = shortsUrl;
  document.getElementById('videoFullLink').href = ex.video.replace('/embed/', '/watch?v=');
  document.getElementById('videoModal').classList.add('active');
}

function closeVideo() {
  document.getElementById('videoFrame').src = '';
  document.getElementById('videoModal').classList.remove('active');
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(modal => {
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeTimer();
      closeWeight();
      closeVideo();
    }
  });
});

// ==================== INIT ====================
renderApp();
</script>
